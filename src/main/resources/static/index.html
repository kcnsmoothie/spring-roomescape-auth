<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Room Escape 예약</title>
  <link rel="stylesheet" href="/css/user.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="logo">Room Escape</h1>
      <nav class="header-nav">
        <a href="#" class="nav-link active" id="nav-booking">예약</a>
        <a href="#" class="nav-link" id="nav-my">내 예약</a>
        <a href="/admin.html" class="nav-link">관리자</a>
      </nav>
      <div class="auth-status">
        <span id="auth-name" class="auth-status__name">로그인 필요</span>
        <button type="button" id="logout-button" class="btn btn--ghost is-hidden">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="main">
    <section id="auth-section" class="auth-section" aria-labelledby="auth-title">
      <div>
        <h2 id="auth-title" class="section-title">로그인</h2>
        <p class="section-desc">예약 생성과 내 예약 조회는 로그인 후 이용할 수 있습니다.</p>
      </div>
      <div class="auth-grid">
        <form id="login-form" class="auth-form">
          <h3>로그인</h3>
          <label class="field">
            <span class="field__label">이메일</span>
            <input type="email" id="login-email" required autocomplete="email" />
          </label>
          <label class="field">
            <span class="field__label">비밀번호</span>
            <input type="password" id="login-password" required autocomplete="current-password" />
          </label>
          <button type="submit" class="btn btn--primary">로그인</button>
        </form>

        <form id="signup-form" class="auth-form">
          <h3>회원가입</h3>
          <label class="field">
            <span class="field__label">이름</span>
            <input type="text" id="signup-name" required autocomplete="name" />
          </label>
          <label class="field">
            <span class="field__label">이메일</span>
            <input type="email" id="signup-email" required autocomplete="email" />
          </label>
          <label class="field">
            <span class="field__label">비밀번호</span>
            <input type="password" id="signup-password" minlength="8" required autocomplete="new-password" />
          </label>
          <button type="submit" class="btn btn--ghost">회원가입</button>
        </form>
      </div>
      <p id="auth-message" class="message" role="status"></p>
    </section>

    <section class="popular-section" aria-labelledby="popular-title">
      <h2 id="popular-title" class="section-title">인기 테마</h2>
      <p class="section-desc">최근 예약이 많은 테마입니다.</p>
      <div id="popular-list" class="popular-strip"></div>
    </section>

    <section class="booking-section" aria-labelledby="booking-title">
      <h2 id="booking-title" class="section-title">예약하기</h2>
      <ol class="steps" aria-label="예약 단계">
        <li class="steps__item is-active" data-step-indicator="1">테마 선택</li>
        <li class="steps__item" data-step-indicator="2">날짜 선택</li>
        <li class="steps__item" data-step-indicator="3">시간 선택</li>
      </ol>

      <div id="step-1" class="step-panel" data-step="1">
        <p class="panel-hint">원하는 테마를 선택하세요.</p>
        <div id="theme-grid" class="theme-grid"></div>
      </div>

      <div id="step-2" class="step-panel is-hidden" data-step="2">
        <div class="step-toolbar">
          <button type="button" id="btn-back-to-themes" class="btn btn--ghost">테마 다시 선택</button>
          <p class="selected-theme-label">선택 테마: <strong id="selected-theme-name">-</strong></p>
        </div>
        <p class="panel-hint">예약 가능한 날짜만 선택할 수 있습니다.</p>
        <div id="calendar-loading" class="loading is-hidden">예약 가능한 날짜를 불러오는 중입니다.</div>
        <div id="calendar-root" class="calendar"></div>
      </div>

      <div id="step-3" class="step-panel is-hidden" data-step="3">
        <div class="step-toolbar">
          <button type="button" id="btn-back-to-calendar" class="btn btn--ghost">날짜 변경</button>
        </div>
        <p class="summary-line">
          <span id="summary-theme">-</span>
          <span aria-hidden="true"> · </span>
          <span id="summary-date">-</span>
        </p>
        <form id="reserve-form" class="reserve-form">
          <label class="field">
            <span class="field__label">시간</span>
            <select id="time-select" name="timeId" required></select>
          </label>
          <button type="submit" class="btn btn--primary">예약 완료</button>
        </form>
        <p id="reserve-message" class="message" role="status"></p>
      </div>
    </section>

    <section id="my-reservation-section" class="my-reservation-section is-hidden" aria-labelledby="my-res-title">
      <div class="section-row">
        <div>
          <h2 id="my-res-title" class="section-title">내 예약</h2>
          <p class="section-desc">로그인한 사용자 기준으로 예약을 조회합니다.</p>
        </div>
        <button type="button" id="my-refresh-button" class="btn btn--ghost">새로고침</button>
      </div>
      <p id="my-search-msg" class="message" role="status"></p>
      <div id="my-result-area" class="my-result-area"></div>
    </section>
  </main>

  <footer class="site-footer">
    <small>Room Escape · 예약 데모</small>
  </footer>

  <script src="/js/user.js" defer></script>
</body>
</html>
